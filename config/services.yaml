services:
    _defaults:
        autowire: true
        autoconfigure: true

    _instanceof:
        Contao\CoreBundle\Framework\FrameworkAwareInterface:
            calls:
                - ['setFramework', ['@contao.framework']]

    Bwein\Gallery\:
        resource: '../src/*'
        exclude:
            - '../src/{DependencyInjection,Model,Resources}'
            - '../src/EventListener/SocialTagsListener.php'
            - '../src/EventListener/ParseFrontendTemplateListener.php'
            - '../src/Data/Extractor/GalleryDataExtractor.php'
            - '../src/EventListener/DataContainer/GalleryChildTableListener.php'
            - '../src/EventListener/DataContainer/MissingLanguageIconListener.php'
            - '../src/EventListener/Navigation/GalleryNavigationListener.php'

    Bwein\Gallery\EventListener\BackendAssetsListener:
        tags:
            - { name: 'kernel.event_listener', event: 'kernel.request' }
